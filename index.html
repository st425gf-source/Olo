<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>أولو هب | Olo Hub Public</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <script src="db.js"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .material-symbols-rounded { font-variation-settings: 'FILL' 0, 'wght' 400; transition: 0.3s; cursor: pointer; }
        .filled { font-variation-settings: 'FILL' 1 !important; }
        .card { background: white; border-radius: 32px; border: 1px solid #f1f5f9; overflow: hidden; transition: 0.4s; cursor: pointer; position: relative; }
        .card:hover { transform: translateY(-10px); box-shadow: 0 30px 60px rgba(0,0,0,0.05); }
        #search-suggestions { position: absolute; top: 100%; right: 0; left: 0; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: none; z-index: 100; border: 1px solid #f1f5f9; margin-top: 8px; }
        .sug-item { padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #f8fafc; display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .sug-item:hover { background: #fefce8; }
        .share-menu { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: none; z-index: 100; border: 1px solid #eee; padding: 10px; width: 160px; }
        .share-menu.active { display: block; }
        .share-btn { width: 100%; text-align: right; padding: 8px 12px; border-radius: 10px; font-size: 12px; display: flex; align-items: center; gap: 8px; transition: 0.2s; }
        .share-btn:hover { background: #f8fafc; }
        #custom-alert { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: #1e293b; color: white; padding: 15px 30px; border-radius: 20px; z-index: 1000; transition: 0.5s; display: flex; align-items: center; gap: 10px; }
        #custom-alert.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body class="pb-20">

    <div id="custom-alert">
        <span class="material-symbols-rounded text-yellow-500" id="alert-icon">info</span>
        <span id="alert-msg">تمت العملية!</span>
    </div>

    <nav class="bg-white/80 backdrop-blur-xl sticky top-0 z-[100] border-b p-4 shadow-sm">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-4">
            <h1 class="text-2xl font-black italic">OLO <span class="text-yellow-500">HUB</span></h1>
            <div class="flex-1 max-w-lg relative">
                <input type="text" id="search" onkeyup="handleSearch(this.value)" placeholder="بحث بالاسم أو الصق الرابط..." class="w-full bg-gray-100 p-3 rounded-2xl outline-none focus:ring-2 ring-yellow-500/10 border-none transition text-sm">
                <div id="search-suggestions"></div>
            </div>
            </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4 mt-8">
        <div id="feed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
    </main>

    <script>
        // دالة لجلب البيانات من ملف db.js الخارجي أو مصفوفة فارغة إذا لم يوجد
        const getDB = () => (typeof PROJECTS_DATA !== 'undefined') ? PROJECTS_DATA : [];
        const getActions = () => JSON.parse(localStorage.getItem('user_actions')) || { likes: [], favs: [] };

        function handleSearch(val) {
            const db = getDB();
            const sugBox = document.getElementById('search-suggestions');
            if (val.includes('id=')) {
                const id = val.split('id=')[1];
                if (db.find(p => p.id == id)) { viewProject(id); return; }
            }
            if (val.trim()) {
                const matches = db.filter(p => p.title.toLowerCase().includes(val.toLowerCase()));
                sugBox.innerHTML = matches.map(m => `<div class="sug-item" onclick="viewProject('${m.id}')"><span class="material-symbols-rounded text-sm">search</span>${m.title}</div>`).join('');
                sugBox.style.display = matches.length ? 'block' : 'none';
                render(matches);
            } else {
                sugBox.style.display = 'none';
                render();
            }
        }

        function render(data = getDB()) {
            const feed = document.getElementById('feed');
            const actions = getActions();
            feed.innerHTML = '';
            data.forEach(p => {
                const isLiked = actions.likes.includes(p.id.toString());
                const isFaved = actions.favs.includes(p.id.toString());
                feed.innerHTML += `
                <div class="card flex flex-col" onclick="viewProject('${p.id}')">
                    <img src="${p.cover}" class="w-full h-48 object-cover">
                    <div class="p-6">
                        <h3 class="text-xl font-black mb-1">${p.title}</h3>
                        <p class="text-[10px] text-gray-400">تفاعل المشاهدين</p>
                    </div>
                    <div class="p-5 border-t flex justify-around text-gray-400" onclick="event.stopPropagation()">
                        <div class="flex flex-col items-center" onclick="handleAction('${p.id}', 'likes')">
                            <span class="material-symbols-rounded ${isLiked ? 'filled text-red-500' : ''}">favorite</span>
                            <span class="text-[9px] font-bold mt-1">${p.likes || 0}</span>
                        </div>
                        <div class="flex flex-col items-center" onclick="handleAction('${p.id}', 'favs')">
                            <span class="material-symbols-rounded ${isFaved ? 'filled text-yellow-500' : ''}">star</span>
                            <span class="text-[9px] font-bold mt-1">${p.favs || 0}</span>
                        </div>
                        <div class="relative">
                            <span onclick="toggleShare(this)" class="material-symbols-rounded">share</span>
                            <div class="share-menu">
                                <button class="share-btn text-blue-600" onclick="socialShare('copy', '${p.id}')"><span class="material-symbols-rounded text-sm">content_copy</span> نسخ الرابط</button>
                                <button class="share-btn text-green-500" onclick="socialShare('wa', '${p.id}', '${p.title}')"><span class="material-symbols-rounded text-sm">chat</span> واتساب</button>
                                <button class="share-btn text-blue-400" onclick="socialShare('tg', '${p.id}', '${p.title}')"><span class="material-symbols-rounded text-sm">send</span> تيليجرام</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            });
        }

        function handleAction(id, type) {
            let actions = getActions();
            const index = actions[type].indexOf(id.toString());
            if (index === -1) {
                actions[type].push(id.toString());
                showAlert("تم التفاعل!", "check_circle");
            } else {
                actions[type].splice(index, 1);
                showAlert("تم الإلغاء", "info");
            }
            localStorage.setItem('user_actions', JSON.stringify(actions));
            render(); 
        }

        function toggleShare(btn) {
            document.querySelectorAll('.share-menu').forEach(m => m !== btn.nextElementSibling ? m.classList.remove('active') : null);
            btn.nextElementSibling.classList.toggle('active');
        }

        function socialShare(plat, id, title) {
            const url = window.location.href.split('?')[0] + "?id=" + id;
            if (plat === 'copy') { navigator.clipboard.writeText(url); showAlert("تم نسخ الرابط!", "link"); }
            if (plat === 'wa') window.open(`https://wa.me/?text=${encodeURIComponent(title + ": " + url)}`);
            if (plat === 'tg') window.open(`https://t.me/share/url?url=${url}&text=${title}`);
        }

        function viewProject(id) {
            const db = getDB();
            const p = db.find(x => x.id == id);
            if(!p) return;
            let htmlContent = p.assets['index.html'];
            Object.keys(p.assets).forEach(fileName => {
                const regex = new RegExp(fileName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
                htmlContent = htmlContent.replace(regex, p.assets[fileName]);
            });
            const win = window.open("", "_blank");
            win.document.write(htmlContent);
            win.document.close();
        }

        function showAlert(msg, icon) {
            const a = document.getElementById('custom-alert');
            document.getElementById('alert-msg').innerText = msg;
            document.getElementById('alert-icon').innerText = icon || 'info';
            a.classList.add('show'); setTimeout(() => a.classList.remove('show'), 2500);
        }

        window.onclick = (e) => {
            if (!e.target.closest('.share-menu') && !e.target.innerText.includes('share')) {
                document.querySelectorAll('.share-menu').forEach(m => m.classList.remove('active'));
            }
            if (!e.target.closest('#search')) document.getElementById('search-suggestions').style.display = 'none';
        };
        render();
    </script>
</body>
</html>
